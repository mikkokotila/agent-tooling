# ACTIVE PR PROMPT: mirrored into both global instruction files.
# Trigger: actionable work on a PR owned by the exact recorded chat. If its owner
# stops with work unresolved, send the same checklist at the next five-/ten-minute poll.
# Busy chats and pending/unavailable evidence alone stay quiet; merge/closure cancels delivery.
# The older sections above are retained for CLI diagnostics and compatibility, not native delivery.
# CI wait is an in-session obligation, bounded at 20 minutes.
[prompts.pr_checklist]
text = """Automated PR hook — ${pr_urls}. Owned by this chat.

Can you verify yes to every question?

1. Is the agreed implementation complete, within scope, and fully pushed to this non-draft PR?
2. Does its head contain the latest live target-branch commit, with no merge conflicts?
3. Have all required local checks passed for the published code and current inputs?
4. Have required CI checks passed on the current head, with no genuine failure left unfixed?
5. Has every review finding—including outdated and Copilot feedback—received an evidenced fix or justified nonfix, a public reply, and resolution of handled inline threads?

Do not stand down before all five are verified. Act on remaining authorized work; an unchanged failure still needs repair, not another status report. Read the failed check's log, diagnose and fix its cause, then push before local checks. An unchanged-input retry refusal requires diagnosis and a meaningful fix, not repeated reruns or a waiver. Wait in-session for CI to conclude; yield on pending CI only after a check exceeds 20 minutes, naming it. Re-read current-head reviews after CI concludes; fix, reply, resolve and re-verify. Re-check the live base before completion and after any base move; update the head unasked. Answer mid-task questions, then resume the PR in the same turn.

Before claiming completion, inspect fresh MERGE_READY evidence (mergeStateStatus, reviewDecision and mergeable). A blocked, behind, conflicting or changes-requested PR is incomplete even if individual findings are resolved. If only unavailable evidence or an evidenced external dependency remains, report the specific dependency truthfully incomplete. A failed check or an unhandled review finding is authorized repair work. Receiving this checklist never discharges that work; monitoring continues until it is resolved or the PR closes.

Before asking for human action, check whether you can do it yourself. If a credential or decision truly requires the human, provide a clickable link, exact steps and what you will do after their answer.
"""

# ACTIVE PRD PROMPT: once after explicit --kind prd gateway creation and GitHub readback.
# Ownership: exact root chat and client; delivered as PostToolUse additional context.
# Linked slice creation, reads, edits, references and retained legacy records stay silent.
# The agent polls in-session every five minutes; no document background job is started.
# Completion requires all scheduled reviews, not silence, elapsed time or the first review.
# Placeholders: ${prd_url}. Keep the minimal-intervention paragraph together and verbatim.
[prompts.prd_review_checklist]
text = '''Automated PRD review hook — ${prd_url}. Owned by this chat.

Can you verify yes to every question?

1. Are the PRD and every agreed slice published and linked?
2. Have all scheduled reviews finished for the PRD and every linked slice?
3. Has every review finding received a fix or justified nonfix and a public reply?
4. Are the revised documents consistent with one another and the agreed scope?
5. Have you re-read the comments after the final review finished and verified that nothing remains unhandled?

Keep this turn active and poll every five minutes until all five are verified. Reviewers start approximately ten minutes after publication and may finish at different times. Address findings as they arrive. Silence or the first completed review does not establish completion.

Minimal, clinical interventions all the way. Get in, get out, do the thing that actually has to be done, never expand it beyond that. Keep asking "is this truly the cleanest and simplest and least intrusive way to get this done" and do it that way and only that way. Don't let others come expand it, let them come make it cleaner.

Once all five are verified, end document-review polling and proceed with the agreed implementation and existing PR workflow.
'''
