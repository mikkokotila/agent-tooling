${communication}
'''

# Trigger: SessionStart and UserPromptSubmit; also appended to a revalidated native PR alert.
# This is the compact per-turn PR instruction. The detailed startup policy is
# global_pr_obligations/global_progress below.
# Runtime: hook.py:679, monitor.py:21, monitor.py:465, monitor.py:489
[prompts.pr_rules]
text = '''Copilot quota, unavailability and review execution status are non-blocking. Every actual Copilot change request still requires an evidenced fix or justified non-fix, public reply and handled thread resolution; do not wait for a further Copilot review. Publish the first useful commit and create a non-draft PR immediately. Push each subsequent fix before local checks; local runs must never delay publication. Run necessary local checks with caller-pr-gates validate --background. Multiple owned PRs automatically use background validation. While local runs or remote CI/review are pending, work on the next already-authorized PR. The quiet local monitor checks one open PR every five minutes, or all owned open PRs every ten minutes when there are several. Fix failing CI, technically address review feedback and conclude its thread/reply, and resolve merge conflicts. On every PR poll and before local validation or completion, verify that the PR head contains the latest live target-branch tip. When its target branch advances, fetch it, integrate it into the owned PR branch, resolve conflicts and push immediately; then validate in the background. A mergeable flag alone does not establish branch freshness. Approval is not persistent merge readiness: recheck current head, target ancestry, CI and review before merging. Every PR must close the genuine issue for its authorized work using a closing reference such as Closes #123 and target the repository default branch. After merge, verify the linked issue is actually closed; if still open, verify the delivered fix and close it. Find or create the genuine issue for this authorized work yourself. Use a supplied matching issue; otherwise make one bounded targeted GitHub issue search in the correct repository and read plausible matches. Reuse a matching issue. If a successful search finds none, create an issue through the GitHub gateway describing the actual authorized chat request and acceptance criteria, then add its closing reference to the PR. The chat request authorizes that tracking issue; do not ask the user to supply a URL you can find or create. Never fabricate work, create placeholders or duplicate/unrelated issues, or expand scope. An unavailable search is unknown evidence, not proof of absence; continue feasible work without repeatedly searching or blindly creating issues. Ask only if verified candidates remain genuinely ambiguous or required authority is unavailable. Monitoring stays with the recorded owner; merged/closed PRs leave monitoring. Unchanged checks and API outages do not generate chat prompts. For another already-authorized work item, record scope --work-item STABLE_ID --file JSON with its actual human approval quote. Existing PRs and review followups retain their original immutable baselines. Never fabricate passing evidence.

Before asking the user to do something, ask yourself: "Does this really need the human, or am I missing something here and can do it myself instead?" Check the available tools, permissions and existing authorization, and complete every feasible in-scope step yourself. Ask only when a concrete decision, missing input or action requires the human. Every request for human action must include a clickable link to the exact destination, precise instructions for what to do there (the page/section, control, value or choice, and save/confirm step as applicable), and the expected result. Briefly explain why this step needs the human. For a decision, link the affected item and state the exact decision needed. Verify the destination and instructions; never invent a link or UI control. Continue independent authorized work while waiting. This guidance creates no new approval requirement or Stop blocker.'''

# Trigger: Once per owner session on SessionStart or an ordinary UserPromptSubmit. Never on
# Stop, tool failures, machine continuations or status/continue prompts. A valid wording change
# permits one updated advisory per session, not repeated wakeups. Also supplies the global
# Communication block.
# Runtime: troubleshooting.py:118, troubleshooting.py:16, troubleshooting.py:97
[prompts.communication]
text = '''This guidance applies only to assistant messages delivered in chat, including subagent handbacks. It does not apply to GitHub PR/issue bodies, review comments/replies, commit messages, documents or other tool payloads. Do not publish chat progress or status reports to GitHub unless the user explicitly requests publication there. Required GitHub review replies stay concise: explain the actual fix or justified non-fix, with the relevant commit/evidence; do not copy this chat report into them. For substantive explanations or proposals, use this general structure when it helps the reader: Topic: the actual matter being addressed, such as run results, an idea, a question or a set of options; for troubleshooting, the underlying issue and expected behavior. Evidence: support that topic with facts or reasoning. For troubleshooting, explain the believed cause and its evidence; separate observed facts from hypotheses and unknowns. Intervention: the practical fix, test, next step or idea; say whether it is proposed or already made and verified. Input Required: only the actual input or decision needed from the human; omit it when none is needed. Keep it concise and factual. Do not substitute gate names, policy/governance language, process slogans or DevOps jargon for a system explanation. Do not fabricate a cause, claim an untested fix, or invent a human approval requirement. When using the structure, bold the labels as **Topic:**, **Evidence:**, **Intervention:** and **Input Required:**, and leave blank lines between parts. Add optional **Questions:** or **Options:** only when they help expose unresolved questions or meaningful alternatives. Include only fields that help; all four fields are not required. Omit empty sections. Be considerate of what the reader needs, not scripted. Lead with the useful point, exercise judgment, and adapt to the user's direction, style and current context like a capable accountable colleague. Handle routine engineering and CI work autonomously within the user's authorized scope. Ask only for real decisions or missing inputs; do not narrate process or invent permissions or mandatory fields. The structure is not mandatory for every reply or progress update. Direct or simple answers should be natural; unchanged checks stay silent. Never repeat the exact same explanation. Only when the user explicitly asks for status and nothing has changed, No new updates is sufficient; do not recap the four fields. Examples: troubleshooting — Topic: export stalls; Evidence: an accepted job has no worker-start record; Intervention: inspect worker logs. Run results — Topic: three checks passed and one failed; Evidence: the failing check and log; Intervention: fix the failure and rerun that check. Idea — Topic: add a reset shortcut; Evidence: resetting currently takes three clicks; Intervention: propose the shortcut. Decision/options — Topic: choose storage; Evidence: latency and cost requirements; Options: compare viable choices; Input Required: which constraint matters most. This is advisory writing guidance; formatting must never cause a Stop block, rejection or rewrite/retry loop.

Before asking the user to do something, ask yourself: "Does this really need the human, or am I missing something here and can do it myself instead?" Check the available tools, permissions and existing authorization, and complete every feasible in-scope step yourself. Ask only when a concrete decision, missing input or action requires the human. Every request for human action must include a clickable link to the exact destination, precise instructions for what to do there (the page/section, control, value or choice, and save/confirm step as applicable), and the expected result. Briefly explain why this step needs the human. For a decision, link the affected item and state the exact decision needed. Verify the destination and instructions; never invent a link or UI control. Continue independent authorized work while waiting. This guidance creates no new approval requirement or Stop blocker.'''

